name: Stage verified EDB 0.2.14 internal installers

on:
  push:
    branches: [codex/release-kma-0.2.14]

permissions:
  contents: read

concurrency:
  group: stage-edb-0214-draft-432108960
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'Muuuuoouuun/edb_make' && github.ref == 'refs/heads/codex/release-kma-0.2.14'
    name: Verify and attach exact internal installers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hashed verification tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-release-bootstrap.lock
      - name: Verify pinned artifacts and attach to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          EDB_STAGING_ROOT: ${{ runner.temp }}/edb-0214-staging
        run: python scripts/stage_edb_0214_test_installers.py
      - name: Preserve attachment verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edb-0214-staging-verification
          path: |
            ${{ runner.temp }}/edb-0214-staging/upload-verification.json
            ${{ runner.temp }}/edb-0214-staging/verified-assets/artifact-verification.json
          if-no-files-found: warn
          retention-days: 14
