name: Stage Draft Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Build Installers run to stage
        required: true
      version:
        description: Existing draft release version
        required: true
        default: '0.2.4'

permissions:
  contents: read

concurrency:
  group: stage-draft-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  stage:
    name: Verify and attach draft assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install hashed metadata verification tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-release-bootstrap.lock
      - name: Verify source run and attach exact artifacts to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/stage_draft_release.py \
            --repository "$RELEASE_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staged-release-evidence
          path: |
            dist/staged/staging-report.json
            dist/staged/release-evidence.zip
          if-no-files-found: error
          retention-days: 14
