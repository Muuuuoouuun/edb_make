name: Quality and Test Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python, quality, and frontend gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-release-bootstrap.lock
            requirements-release.lock
            requirements-ci.lock

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-release-bootstrap.lock
          python -m pip install --disable-pip-version-check --require-hashes --no-build-isolation -r requirements-release.lock
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
          python -m pip check

      - name: Run Python test suite
        run: python -m pytest -q

      - name: Verify frontend package and bundle digest (read-only)
        run: python scripts/verify_frontend_package.py

      - name: Run synthetic quality gate
        run: |
          python scripts/evaluate_quality_corpus.py quality/synthetic-corpus.json \
            --json-report "$RUNNER_TEMP/quality-report.json" \
            --markdown-report "$RUNNER_TEMP/quality-report.md"

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-gate-report
          path: |
            ${{ runner.temp }}/quality-report.json
            ${{ runner.temp }}/quality-report.md
          if-no-files-found: ignore
          retention-days: 14

  native:
    # Linux skips the Windows-only tests (os.name == "nt", Windows PowerShell 5.1) and the
    # zsh tests of the macOS updater and packager. Run them on the OS they are for.
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            tests: ""  # whole suite: most teachers use Windows
          - os: macos-15
            tests: test_app_auto_update.py test_macos_dmg_retry.py test_release_packaging_hardening.py
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        # bash fails the step on any failed command; pwsh would check only the last one.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-release-bootstrap.lock
            requirements-release.lock
            requirements-ci.lock

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-release-bootstrap.lock
          python -m pip install --disable-pip-version-check --require-hashes --no-build-isolation -r requirements-release.lock
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
          python -m pip check

      - name: Run Python tests
        run: python -m pytest -q -rs ${{ matrix.tests }}
