name: Build Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.1"
        required: true
        default: "0.1.0"
      update_feed_url:
        description: "Public update feed URL used by installed apps"
        required: false
        default: ""
      release_notes_url:
        description: "Public release notes URL"
        required: false
        default: ""
      manifest_url:
        description: "Public release manifest URL"
        required: false
        default: ""
      macos_download_url:
        description: "Public macOS DMG download URL"
        required: false
        default: ""
      windows_download_url:
        description: "Public Windows Setup.exe download URL"
        required: false
        default: ""

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-local.txt pyinstaller

      - name: Import macOS signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64}" ]]; then
            echo "No macOS signing certificate configured; building ad-hoc signed package."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/app-signing.p12"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          CERTIFICATE_PATH="$CERTIFICATE_PATH" python -c 'import base64, os, pathlib; pathlib.Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[ "]//g')
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "MACOS_SIGNING_ENABLED=1" >> "$GITHUB_ENV"

      - name: Build macOS package
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          chmod +x ./package_macos_app.sh
          args=(--clean --dmg --zip \
            --version "${{ inputs.version }}" \
            --update-feed-url "${{ inputs.update_feed_url }}" \
            --download-url "${{ inputs.macos_download_url }}" \
            --release-notes-url "${{ inputs.release_notes_url }}")

          if [[ "${MACOS_SIGNING_ENABLED:-0}" == "1" ]]; then
            args+=(--sign-identity "${MACOS_CODESIGN_IDENTITY:-auto}")
            if [[ -n "$APPLE_NOTARY_KEY_ID" && -n "$APPLE_NOTARY_ISSUER_ID" && -n "$APPLE_NOTARY_KEY_P8_BASE64" ]]; then
              NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
              NOTARY_KEY_PATH="$NOTARY_KEY_PATH" python -c 'import base64, os, pathlib; pathlib.Path(os.environ["NOTARY_KEY_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_NOTARY_KEY_P8_BASE64"]))'
              args+=(--notarize --notary-key "$NOTARY_KEY_PATH" --notary-key-id "$APPLE_NOTARY_KEY_ID" --notary-issuer "$APPLE_NOTARY_ISSUER_ID")
            else
              echo "Notary API key secrets are missing; signed but not notarized."
            fi
          fi

          ./package_macos_app.sh "${args[@]}"

      - name: Verify DMG
        run: hdiutil verify dist/ClassInEDBMVP-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            dist/ClassInEDBMVP-macOS.dmg
            dist/ClassInEDBMVP-macOS.zip

  windows:
    name: Windows Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-local.txt pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          $packageArgs = @(
            "-Clean",
            "-Version", "${{ inputs.version }}",
            "-UpdateFeedUrl", "${{ inputs.update_feed_url }}",
            "-DownloadUrl", "${{ inputs.windows_download_url }}",
            "-ReleaseNotesUrl", "${{ inputs.release_notes_url }}"
          )

          if ($env:WINDOWS_CERTIFICATE_PFX_BASE64) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
            [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
            $packageArgs += @("-Sign", "-SignCertificatePath", $certificatePath)
            if ($env:WINDOWS_CERTIFICATE_PASSWORD) {
              $packageArgs += @("-SignCertificatePassword", $env:WINDOWS_CERTIFICATE_PASSWORD)
            }
            if ($env:WINDOWS_SIGN_TIMESTAMP_URL) {
              $packageArgs += @("-SignTimestampUrl", $env:WINDOWS_SIGN_TIMESTAMP_URL)
            }
          } else {
            Write-Host "No Windows signing certificate configured; building unsigned package."
          }

          .\package_windows_installer.ps1 @packageArgs

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/ClassInEDBMVP-Setup.exe

  update-feed:
    name: Update Feed
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Build update feed
        run: |
          python scripts/build_update_feed.py \
            --version "${{ inputs.version }}" \
            --app-id "ClassInEDBMVP" \
            --app-name "ClassInEDBMVP" \
            --channel "stable" \
            --summary "ClassInEDBMVP ${{ inputs.version }}" \
            --update-feed-url "${{ inputs.update_feed_url }}" \
            --release-notes-url "${{ inputs.release_notes_url }}" \
            --manifest-url "${{ inputs.manifest_url }}" \
            --macos-url "${{ inputs.macos_download_url }}" \
            --macos-file release-artifacts/macos-installer/ClassInEDBMVP-macOS.dmg \
            --windows-url "${{ inputs.windows_download_url }}" \
            --windows-file release-artifacts/windows-installer/ClassInEDBMVP-Setup.exe \
            --git-commit "${{ github.sha }}" \
            --build-number "${{ github.run_number }}" \
            --manifest-output dist/manifest.json \
            --checksums-output dist/checksums.txt \
            --output dist/update.json

      - uses: actions/upload-artifact@v4
        with:
          name: update-feed
          path: |
            dist/update.json
            dist/manifest.json
            dist/checksums.txt
