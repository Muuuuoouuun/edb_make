function resetLayout(){scale=100;x=y=0;contentWidth='33';gapMode='fit';extraSpace=0;syncLayout();notify('현재 문항의 너비·크기·위치·여백을 초기화했습니다.');}
syncSelected();syncLayout();
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
if(b.dataset.toast){notify(b.dataset.toast);return;}
if(b.dataset.item){chooseMaterial(Number(b.dataset.item));return;}
if(b.dataset.step){const index=data.findIndex(item=>item.id===selected);const next=data[index+Number(b.dataset.step)];if(next)chooseMaterial(next.id,!!b.closest('.inspector'));return;}
if(b.dataset.mobile){setMobile(b.dataset.mobile);return;}
if(b.dataset.filter){filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(e=>{e.classList.toggle('active',e===b);e.setAttribute('aria-pressed',String(e===b));});applyFilter();return;}
if(b.dataset.tab){selectTab(b.dataset.tab);return;}
if(b.dataset.zoom){zoom=Math.min(140,Math.max(50,zoom+Number(b.dataset.zoom)));texts('.zoom-output',zoom+'%');document.querySelector('.board-frame').style.setProperty('--zoom',zoom/100);return;}
if(b.dataset.width){contentWidth=b.dataset.width;syncLayout();return;}
if(b.dataset.scaleStep){setScale(scale+Number(b.dataset.scaleStep));return;}
if(b.dataset.nudge){if(b.dataset.nudge==='reset')x=y=0;if(b.dataset.nudge==='up')y-=2;if(b.dataset.nudge==='down')y+=2;if(b.dataset.nudge==='left')x-=2;if(b.dataset.nudge==='right')x+=2;x=Math.max(-20,Math.min(20,x));y=Math.max(-20,Math.min(20,y));move();return;}
if(b.dataset.gap){gapMode=b.dataset.gap;syncLayout();return;}
if(b.dataset.space){extraSpace=Math.max(0,Math.min(3,extraSpace+Number(b.dataset.space)));syncLayout();return;}
if(b.dataset.method){document.querySelectorAll('[data-method]').forEach(e=>{e.classList.toggle('active',e===b);e.setAttribute('aria-pressed',String(e===b));});notify(b.textContent+' 방식을 선택했습니다.');return;}
if(b.dataset.page){document.querySelectorAll('[data-page]').forEach(e=>{e.classList.toggle('active',e===b);e.setAttribute('aria-pressed',String(e===b));});document.querySelector('.board-page-info').textContent=String(b.dataset.page).padStart(2,'0')+' / 04 CLASSIN';document.querySelector('.board-scroll').scrollTo({top:(Number(b.dataset.page)-1)*180,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});return;}
if(b.dataset.chapter){document.querySelectorAll('[data-chapter]').forEach(e=>{e.classList.toggle('active',e===b);e.setAttribute('aria-pressed',String(e===b));});const range={intro:[1,2],practice:[3,4],finish:[5,6]}[b.dataset.chapter];document.querySelectorAll('.film-card').forEach(e=>e.hidden=!!range&&!range.includes(Number(e.dataset.item)));return;}
switch(b.dataset.action){
case 'add':data.push({id:data.length+1,title:'추가한 샘플 자료',page:'4쪽',kind:'번호 확인',ready:false});rebuildLists();notify('샘플 자료를 추가했습니다. 실제 파일은 업로드되지 않습니다.');break;
case 'preserve':notify('전체 '+data.length+'개 자료에 원문 보존 방식을 지정했습니다.');break;
case 'fit':zoom=100;texts('.zoom-output','100%');document.querySelector('.board-frame').style.setProperty('--zoom',1);document.querySelector('.board-scroll').scrollTo({top:0,left:0});notify('칠판을 기본 보기로 맞췄습니다.');break;
case 'position-reset':case 'layout-reset':resetLayout();break;
case 'close-editor':if(matchMedia('(max-width:760px), (max-height:480px) and (max-width:1100px)').matches){setMobile('stage');document.querySelector('[data-mobile="panel"]').focus();}else{setFocus(true);document.querySelector('.focus-toggle').focus();}break;
case 'focus':setFocus(!document.body.classList.contains('is-focused'));break;
case 'materials':{const open=!materialPanelOpen;if(open&&document.body.classList.contains('is-focused'))setFocus(false);setMaterialsOpen(open);break;}
case 'close-materials':setMaterialsOpen(false);if(matchMedia('(max-width:760px), (max-height:480px) and (max-width:1100px)').matches)setMobile('stage');else document.querySelector('[data-action=materials]').focus();break;
case 'board':setMaterialsOpen(false);break;
case 'show-layout':showInspector('layout');break;
case 'show-source':showInspector('source');break;
case 'inspector':{const el=document.querySelector('.inspector');el.hidden=!el.hidden;b.setAttribute('aria-expanded',String(!el.hidden));break;}
case 'review':data.find(i=>i.id===selected).ready=true;rebuildLists();notify('자료 '+String(selected).padStart(2,'0')+'의 번호를 확인했습니다.');break;
case 'reset':location.reload();break;
}
});
document.getElementById('material-search').addEventListener('input',e=>{searchQuery=e.target.value.trim().toLowerCase();applyFilter();});
document.getElementById('scale').addEventListener('input',e=>setScale(e.target.value));
document.getElementById('material-name').addEventListener('change',e=>{const name=e.target.value.trim();if(name){data.find(i=>i.id===selected).title=name;rebuildLists();notify('목업의 자료 이름을 변경했습니다.');}});
document.getElementById('material-number').addEventListener('input',e=>{const item=data.find(i=>i.id===selected);item.number=e.target.value.trim()||String(selected).padStart(2,'0');item.ready=false;texts('.review-status','번호 확인 필요');document.querySelector('.review-status').classList.add('needs-review');syncReview();});
document.getElementById('material-number').addEventListener('change',()=>{rebuildLists();notify('문항 번호를 변경했습니다. 원문을 확인해 주세요.');});
document.getElementById('boundary-visible').addEventListener('change',e=>document.querySelectorAll('.page-line').forEach(line=>line.hidden=!e.target.checked));
document.getElementById('dark-board').addEventListener('change',e=>document.querySelector('.board-frame').style.setProperty('--board',e.target.checked?'#17271f':''));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('details.page-popover[open]').forEach(d=>{d.open=false;d.querySelector('summary').focus();});if((variant==='b'||variant==='d')&&!matchMedia('(max-width:760px), (max-height:480px) and (max-width:1100px)').matches){if(document.body.classList.contains('is-focused')){setFocus(false);document.querySelector('.focus-toggle').focus();}else if(materialPanelOpen){setMaterialsOpen(false);document.querySelector('[data-action=materials]').focus();}if(variant==='d'){document.querySelector('.inspector').hidden=true;document.querySelector('[data-action=inspector]').setAttribute('aria-expanded','false');}}document.querySelector('.toast').classList.remove('show');}});
</script>
</body>
</html>
