<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>영역 다시 잡기 · 시각 비교</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #eef1f5; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
    figure { margin: 0; overflow: hidden; border: 1px solid #d6dce5; border-radius: 12px; background: white; box-shadow: 0 8px 24px rgba(26, 35, 52, .08); }
    figcaption { padding: 10px 12px; border-bottom: 1px solid #e4e8ee; font-weight: 700; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <figure>
      <figcaption>기준 시안</figcaption>
      <img src="source-visual.png" alt="기준 시안">
    </figure>
    <figure>
      <figcaption>실제 구현 · 1404×1024</figcaption>
      <img src="implementation-1440x1024.png" alt="실제 구현">
    </figure>
  </main>
</body>
</html>
