<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>칠판 자료 편집기</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="./favicon.png" type="image/png" />
<link rel="preload" href="vendor/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="vendor/fonts/JetBrainsMonoVariable.woff2" as="font" type="font/woff2" crossorigin />

</head>
<body>
<div id="root"></div>
<script>
(function(){
  const diagnostics = [];
  function messageFrom(value){
    if (!value) return '알 수 없는 오류';
    if (value.message) return String(value.message);
    return String(value);
  }
  function captureRuntimeDiagnostic(entry){
    diagnostics.push(entry);
    if (diagnostics.length > 50) diagnostics.splice(0, diagnostics.length - 50);
    return entry;
  }
  function showRuntimeError(entry){
    captureRuntimeDiagnostic(entry);
    if (entry && entry.skipGlobalPanel) return;
    if (!document.body || document.querySelector('.runtime-crash-panel')) return;
    const panel = document.createElement('div');
    panel.className = 'runtime-crash-panel';
    panel.setAttribute('role', 'alert');
    panel.style.cssText = 'position:fixed;inset:16px;z-index:2147483647;box-sizing:border-box;overflow:auto;border:1px solid #ef4444;background:#fff5f5;color:#1f2937;padding:16px;font:13px/1.5 system-ui,-apple-system,sans-serif;border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,0.18);display:flex;flex-direction:column;gap:12px;';

    const header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #fecaca;padding-bottom:10px;';

    const title = document.createElement('strong');
    title.style.cssText = 'font-size:15px;color:#991b1b;';
    title.textContent = '앱 실행 중 오류가 발생했습니다';

    const btnGroup = document.createElement('div');
    btnGroup.style.cssText = 'display:flex;gap:8px;';

    const reloadBtn = document.createElement('button');
    reloadBtn.textContent = '새로고침';
    reloadBtn.type = 'button';
    reloadBtn.style.cssText = 'padding:4px 10px;border-radius:6px;border:1px solid #dc2626;background:#ef4444;color:#fff;font-weight:600;font-size:12px;cursor:pointer;';
    reloadBtn.onclick = function(){ window.location.reload(); };

    const closeBtn = document.createElement('button');
    closeBtn.textContent = '닫기';
    closeBtn.type = 'button';
    closeBtn.style.cssText = 'padding:4px 10px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#374151;font-size:12px;cursor:pointer;';
    closeBtn.onclick = function(){ panel.remove(); };

    btnGroup.appendChild(reloadBtn);
    btnGroup.appendChild(closeBtn);
    header.appendChild(title);
    header.appendChild(btnGroup);

    const body = document.createElement('pre');
    body.style.cssText = 'margin:0;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:monospace;font-size:12px;color:#7f1d1d;flex:1;background:#fef2f2;padding:12px;border-radius:6px;';
    body.textContent = messageFrom(entry.error || entry.reason || entry.message);

    panel.appendChild(header);
    panel.appendChild(body);
    document.body.appendChild(panel);
  }
  window.EDB_RUNTIME_DIAGNOSTICS = diagnostics;
  window.EDB_CAPTURE_RUNTIME_DIAGNOSTIC = captureRuntimeDiagnostic;
  window.EDB_REPORT_RUNTIME_ERROR = showRuntimeError;
  window.addEventListener('error', event => showRuntimeError({
    type: 'error',
    message: event.message,
    error: event.error,
    filename: event.filename,
    lineno: event.lineno,
    colno: event.colno,
  }));
  window.addEventListener('unhandledrejection', event => showRuntimeError({
    type: 'unhandledrejection',
    reason: event.reason,
  }));
})();
</script>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

</body>
</html>
